name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "0 0 * * 0"  # Every Sunday
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Jasper2310/github-profile-3d-contrib@main
        with:
          username: 01Yash01
          output_path: profile-3d-contrib/profile-green.svg

      - name: Commit & Push
        run: |
          git config --global user.name "Yash"
          git config --global user.email "sisodiya98yash@gmail.com"
          git add profile-3d-contrib/profile-green.svg
          git commit -m "Update 3D contribution graph"
          git push
